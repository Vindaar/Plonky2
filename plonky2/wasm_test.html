<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plonky2 GPU Merkle Tree Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-top: 0;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        h2 {
            color: #555;
            margin-top: 30px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #f0f0f0;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: none;
        }
        #status.show {
            display: block;
        }
        #status.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        #status.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        #status.loading {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        #console {
            margin-top: 20px;
            padding: 15px;
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .console-entry {
            margin: 3px 0;
            padding: 2px 0;
        }
        .console-log {
            color: #d4d4d4;
        }
        .console-warn {
            color: #dcdcaa;
        }
        .console-error {
            color: #f48771;
        }
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .result-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .result-label {
            font-weight: bold;
            color: #555;
            display: inline-block;
            width: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌳 Plonky2 GPU Merkle Tree Test</h1>

        <div class="info-box">
            <strong>About this test:</strong>
            <p>This test constructs a Merkle tree using GPU acceleration (WebGPU) from test vectors loaded from <code>test-vector-small.txt</code>. The Merkle tree uses the Poseidon hash function over the Goldilocks field.</p>
        </div>

        <button id="runTest" onclick="runTest()">Run Merkle Tree Test</button>

        <div id="status"></div>

        <h2>Console Output</h2>
        <div id="console"></div>
    </div>

    <script type="module">
        // Intercept console.log, console.warn, console.error
        const consoleDiv = document.getElementById('console');
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;

        function addConsoleEntry(message, type) {
            const entry = document.createElement('div');
            entry.className = `console-entry console-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        console.log = function(...args) {
            originalLog.apply(console, args);
            addConsoleEntry(args.join(' '), 'log');
        };

        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addConsoleEntry(args.join(' '), 'warn');
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            addConsoleEntry(args.join(' '), 'error');
        };

        // Load the WASM module
        let wasmModule;

        async function initWasm() {
            try {
                console.log('Loading WASM module...');
                // Import the WASM module
                const wasmImport = await import('./pkg/plonky2.js');
                console.log('WASM JavaScript loaded');

                // Initialize the WASM module
                await wasmImport.default();
                console.log('WASM module initialized');

                // Store the initialized module
                wasmModule = wasmImport;

                // Check if required functions exist
                if (typeof wasmModule.get_test_vector_count === 'undefined') {
                    throw new Error('get_test_vector_count function not found in WASM module. Did you build with --features gpu_merkle?');
                }
                if (typeof wasmModule.test_merkle_tree_construction === 'undefined') {
                    throw new Error('test_merkle_tree_construction function not found in WASM module. Did you build with --features gpu_merkle?');
                }

                console.log(`Test vectors available: ${wasmModule.get_test_vector_count()}`);

                console.log("Init GPU merkle");
                await wasmModule.init_gpu_merkle();
                console.log("... done");

                return true;
            } catch (error) {
                console.error('Failed to load WASM module:', error);
                return false;
            }
        }

        // Run the test
        window.runTest = async function() {
            const button = document.getElementById('runTest');
            const status = document.getElementById('status');

            button.disabled = true;
            status.className = 'show loading';
            status.textContent = 'Loading WASM module and initializing...';

            try {
                if (!wasmModule) {
                    const success = await initWasm();
                    if (!success) {
                        throw new Error('Failed to initialize WASM module');
                    }
                }

                status.textContent = 'Running Merkle tree construction test...\nThis may take a few seconds.';
                console.log('Starting Merkle tree construction...');

                const startTime = performance.now();
                const result = await wasmModule.test_merkle_tree_construction();
                const endTime = performance.now();
                const duration = ((endTime - startTime) / 1000).toFixed(3);

                console.log('Test completed successfully!');

                status.className = 'show success';
                status.innerHTML = `
                    <strong>✓ Test Completed Successfully!</strong>
                    <div class="result-item"><span class="result-label">Duration:</span>${duration} seconds</div>
                    <div class="result-item"><span class="result-label">Number of Leaves:</span>${result.numLeaves}</div>
                    <div class="result-item"><span class="result-label">Padded Size:</span>${result.paddedSize}</div>
                    <div class="result-item"><span class="result-label">Cap Height:</span>${result.capHeight}</div>
                    <div class="result-item"><span class="result-label">Number of Digests:</span>${result.numDigests}</div>
                    <div class="result-item"><span class="result-label">Root Hash:</span>${result.rootHash}</div>
                `;
            } catch (error) {
                console.error('Test failed:', error);
                status.className = 'show error';
                status.textContent = `✗ Test Failed\n\nError: ${error.message || error}\n\nCheck the console output above for details.`;
            } finally {
                button.disabled = false;
            }
        };

        // Initialize on page load
        console.log('Page loaded. Click "Run Merkle Tree Test" to start.');
        console.log('Note: WebGPU must be supported by your browser.');
    </script>
</body>
</html>
